[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-bayes-lab"
version = "0.1.0"
description = "Auditable finite Bayesian models and interactive sensitivity plots for seed-selection claims"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seed Bayes Lab contributors" }]
dependencies = ["numpy>=1.24", "plotly>=5.18"]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=7.4"]

[project.scripts]
seed-bayes-demo = "seed_bayes_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
